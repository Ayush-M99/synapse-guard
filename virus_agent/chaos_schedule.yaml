scenarios:

  demo_scenario_1:
    name: "Gen 1 — Immunity Acquired"
    description: "pod_crash_A twice — second encounter hits T-cell memory"
    virus_gen: 1
    steps:
      - t: 0
        strand: pod_crash_A
        target: payment-service
        expect: anomaly_detected
      - t: 20
        strand: pod_crash_A
        target: payment-service
        expect: fast_recovery     # T-cell hit — should be <2s

  demo_scenario_2:
    name: "Gen 2 — Timing Attack + Preemptive Scale"
    description: "Virus mutates; LSTM predicts; antibody pre-scales before strike"
    virus_gen: 2
    steps:
      - t: 0
        strand: pod_crash_A
        target: payment-service
        expect: recovery_started
      - t: 8
        strand: timing_A
        target: payment-service
        expect: preemptive_block
      - t: 20
        strand: network_A
        target: api-gateway
        expect: anomaly_detected

  demo_scenario_3:
    name: "Gen 3 — Unknown Strand Honeypot Discovery"
    description: "Low-confidence attack triggers honeypot; new node crystallized in Neo4j"
    virus_gen: 3
    steps:
      - t: 0
        strand: camouflage_A
        target: auth-service
        expect: honeypot_deployed
      - t: 15
        expect: new_node_on_brain_map
      - t: 30
        strand: camouflage_A
        target: auth-service
        expect: fast_recovery      # Now known — T-cell hit

  demo_full:
    name: "Full Demo — All Three Scenarios"
    description: "5-minute full demo sequence"
    steps:
      - run: demo_scenario_1
      - wait: 10
      - run: demo_scenario_2
      - wait: 10
      - run: demo_scenario_3
