---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: darwin-target
  labels:
    app: inventory-service
    darwin-monitored: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        darwin-monitored: "true"
    spec:
      containers:
      - name: inventory-service
        image: darwin/inventory-service:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

      - name: nerve-ending
        image: darwin/nerve-ending:v1.0
        
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: MONITORED_SERVICE
          value: "inventory-service"
        - name: NATS_URL
          value: "nats://nats.darwin-infra:4222"
        - name: APP_METRICS_URL
          value: "http://localhost:9090/metrics"
        - name: COLLECTION_INTERVAL_SECONDS
          value: "2"

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: darwin-target
  labels:
    app: inventory-service
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
