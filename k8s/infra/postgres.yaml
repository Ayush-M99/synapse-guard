apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: darwin-infra
data:
  init.sql: |
    CREATE DATABASE darwin;
    CREATE TABLE failure_events (
      event_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      signature_hash VARCHAR(64) UNIQUE,
      failure_signature JSONB,
      detected_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      recovered_at TIMESTAMP,
      recovery_time_seconds FLOAT,
      recovery_actions JSONB,
      success BOOLEAN,
      generation INT DEFAULT 1
    );
    CREATE INDEX idx_signature_hash ON failure_events(signature_hash);
    CREATE INDEX idx_detected_at ON failure_events(detected_at DESC);

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: darwin-infra
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        env:
        - name: POSTGRES_USER
          value: "darwin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U darwin
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U darwin
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: darwin-infra
type: Opaque
stringData:
  password: "darwinpassword"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: darwin-infra
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    name: postgres
