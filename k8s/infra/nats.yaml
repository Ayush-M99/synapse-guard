apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: darwin-infra
data:
  nats.conf: |
    # NATS Server Configuration
    port: 4222
    max_payload: 8388608
    server_name: nats-server

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: darwin-infra
spec:
  serviceName: "nats"
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: http
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/nats
      volumes:
      - name: config
        configMap:
          name: nats-config

---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: darwin-infra
  labels:
    app: nats
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
  - port: 4222
    name: client
  - port: 6222
    name: cluster
  - port: 8222
    name: http
