global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'darwin-local'
    platform: 'darwin'

scrape_configs:
  # ─── DARWIN Internal Modules ───────────────────────────────────────────────

  - job_name: 'ws-bridge'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics

  - job_name: 'ml-pipeline'
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: /metrics

  # ─── Patient Microservices (via minikube NodePort or port-forward) ─────────
  # These will be port-forwarded from minikube during demo:
  #   kubectl port-forward svc/auth-service 8010:80 -n patient
  #   kubectl port-forward svc/api-gateway 8011:80 -n patient
  #   kubectl port-forward svc/order-service 8012:80 -n patient
  #   kubectl port-forward svc/payment-service 8013:80 -n patient
  #   kubectl port-forward svc/inventory-service 8014:80 -n patient
  #   kubectl port-forward svc/notification-service 8015:80 -n patient

  - job_name: 'patient-auth'
    static_configs:
      - targets: ['host.docker.internal:8010']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'auth-service'

  - job_name: 'patient-gateway'
    static_configs:
      - targets: ['host.docker.internal:8011']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'api-gateway'

  - job_name: 'patient-order'
    static_configs:
      - targets: ['host.docker.internal:8012']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'order-service'

  - job_name: 'patient-payment'
    static_configs:
      - targets: ['host.docker.internal:8013']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'payment-service'

  - job_name: 'patient-inventory'
    static_configs:
      - targets: ['host.docker.internal:8014']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'inventory-service'

  - job_name: 'patient-notification'
    static_configs:
      - targets: ['host.docker.internal:8015']
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'notification-service'

  # ─── Prometheus self-scrape ───────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ─── NATS monitoring ─────────────────────────────────────────────────────
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: /healthz
