# Darwin Chaos Platform - Microservices Kubernetes Manifests
# Deploy with: kubectl apply -f k8s-manifests.yaml

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: darwin-microservices
  labels:
    app.kubernetes.io/part-of: darwin-chaos-platform
    chaos-enabled: "true"

---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: darwin-microservices
data:
  DATABASE_URL: "postgresql://chaos:chaospassword@postgres.darwin-infra.svc.cluster.local:5432/chaos_dna"
  REDIS_URL: "redis://redis.darwin-infra.svc.cluster.local:6379"
  NATS_URL: "nats://nats.darwin-infra.svc.cluster.local:4222"
  AUTH_SERVICE_URL: "http://auth-service:8000"
  ORDER_SERVICE_URL: "http://order-service:8000"
  PAYMENT_SERVICE_URL: "http://payment-service:8000"
  INVENTORY_SERVICE_URL: "http://inventory-service:8000"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8000"
  JWT_SECRET: "darwin-chaos-jwt-secret-change-in-production"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION: "3600"

---
# ============================================
# AUTH SERVICE
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: darwin-microservices
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
        chaos-target: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: auth-service
          image: darwin/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: microservices-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: darwin-microservices
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: auth-service

---
# ============================================
# API GATEWAY
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: darwin-microservices
  labels:
    app: api-gateway
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: frontend
        chaos-target: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-gateway
          image: darwin/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: microservices-config
          env:
            - name: RATE_LIMIT_REQUESTS
              value: "100"
            - name: RATE_LIMIT_WINDOW
              value: "60"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: darwin-microservices
  labels:
    app: api-gateway
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
  selector:
    app: api-gateway

