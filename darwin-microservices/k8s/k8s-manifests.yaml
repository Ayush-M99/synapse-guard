---
# ============================================
# PROMETHEUS SERVICE MONITOR
# ============================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: darwin-microservices
  namespace: darwin-microservices
  labels:
    app: darwin-microservices
spec:
  selector:
    matchLabels:
      tier: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - darwin-microservices

---
# ============================================
# INGRESS (Optional - for external access)
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: darwin-ingress
  namespace: darwin-microservices
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: darwin.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

---
# ============================================
# NETWORK POLICY (Security)
# ============================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: darwin-network-policy
  namespace: darwin-microservices
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: darwin-microservices
        - namespaceSelector:
            matchLabels:
              name: darwin-infra
        - namespaceSelector:
            matchLabels:
              name: monitoring
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: darwin-microservices
        - namespaceSelector:
            matchLabels:
              name: darwin-infra
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
